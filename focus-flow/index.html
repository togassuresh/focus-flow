<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="A minimalist Pomodoro timer with a task list and animated progress ring.">
<meta name="theme-color" content="#0f1115">
<title>Focus Flow</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22%237c9eff%22/></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>Focus Flow</h1>
      <div class="mode-switch" role="group" aria-label="Timer mode">
        <button class="mode-btn active" data-mode="focus" aria-pressed="true">Focus</button>
        <button class="mode-btn" data-mode="short" aria-pressed="false">Short Break</button>
        <button class="mode-btn" data-mode="long" aria-pressed="false">Long Break</button>
      </div>
    </header>

    <main class="timer-section">
      <div class="ring-wrap">
        <svg class="ring" width="280" height="280" viewBox="0 0 280 280">
          <circle class="ring-bg" cx="140" cy="140" r="120"></circle>
          <circle class="ring-progress" cx="140" cy="140" r="120"></circle>
        </svg>
        <div class="ring-center">
          <div class="time-display" id="timeDisplay">25:00</div>
          <div class="session-label" id="sessionLabel">Session 1</div>
        </div>
      </div>

      <div class="controls">
        <button class="control-btn secondary" id="resetBtn" title="Reset (R)">Reset</button>
        <button class="control-btn primary" id="startPauseBtn" title="Start/Pause (Space)">Start</button>
        <button class="control-btn secondary" id="skipBtn" title="Skip (S)">Skip</button>
        <button class="control-btn icon-btn" id="muteBtn" title="Mute chime" aria-label="Mute chime">🔊</button>
      </div>

      <p class="hint">Space: start/pause &middot; R: reset &middot; S: skip &middot; N: new task</p>
      <p class="daily-stat" id="dailyStat" title="Resets at midnight, local time">0 sessions today</p>
      <p class="sr-only" id="announcer" aria-live="polite"></p>
    </main>

    <section class="tasks-section">
      <div class="tasks-header">
        <h2>Tasks</h2>
        <div class="tasks-header-right">
          <span class="task-count" id="taskCount">0 done</span>
          <button type="button" class="clear-done-btn" id="clearDoneBtn">Clear completed</button>
        </div>
      </div>
      <form id="taskForm" class="task-form">
        <input type="text" id="taskInput" placeholder="Add a task and press Enter..." autocomplete="off" maxlength="120">
        <button type="submit" class="task-add-btn" aria-label="Add task">Add</button>
      </form>
      <span class="char-counter" id="charCounter">0/120</span>
      <ul class="task-list" id="taskList"></ul>
      <p class="empty-state" id="emptyState">No tasks yet. Add one to get started, or press N.</p>
    </section>

    <button type="button" class="reset-all-btn" id="resetAllBtn">Reset all data</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
